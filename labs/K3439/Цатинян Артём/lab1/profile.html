<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Мои брони — tablely</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">tablely<span>.</span></a
        ><a class="link-dark" href="index.html">Найти ресторан</a>
      </div>
    </nav>
    <main class="container py-5">
      <p class="eyebrow">Личный кабинет</p>
      <h1 data-user-name>Привет, Артём</h1>
      <div class="row g-4 mt-2">
        <section class="col-lg-8">
          <div class="bg-white rounded-4 p-4 shadow-sm">
            <p class="eyebrow">Ближайшая бронь</p>
            <h2>Cielo</h2>
            <p class="text-secondary" data-booking>
              Сегодня, 20:00 · 2 гостя · наб. реки Фонтанки, 11
            </p>
            <a class="btn btn-outline-dark" href="restaurant.html"
              >Изменить бронь</a
            ><button class="btn btn-outline-danger ms-2" data-cancel-booking>
              Отменить
            </button>
          </div>
        </section>
        <aside class="col-lg-4">
          <div class="rounded-4 p-4" style="background: #f2e8dc">
            <b>8</b>
            <p class="mb-0 text-secondary">ресторанов сохранено</p>
          </div>
        </aside>
      </div>
      <h2 class="mt-5">История бронирований</h2>
      <div class="bg-white rounded-4 p-3 mt-3">
        Forma · 11 октября · Завершено
      </div>
    </main>
    <script src="assets/js/app.js"></script>
  </body>
</html>
