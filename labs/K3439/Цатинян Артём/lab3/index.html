<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tablely — бронирование ресторанов</title>
    <script>
      (function () {
        const s = localStorage.getItem("tablely-theme");
        document.documentElement.dataset.bsTheme =
          s === "light" || s === "dark"
            ? s
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
